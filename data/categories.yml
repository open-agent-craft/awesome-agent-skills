maturity:
  - key: "recommended"
    label: "Recommended"
    description: "Practical, documented, reusable, and safe enough for most teams to evaluate first."
  - key: "promising"
    label: "Promising"
    description: "Useful and directionally strong, with some gaps in examples, maintenance, or portability."
  - key: "experimental"
    label: "Experimental"
    description: "Interesting early-stage work. Inspect before using in serious workflows."
  - key: "archived"
    label: "Archived"
    description: "Historically useful or educational, but no longer maintained or not recommended for new usage."
