name: Awesome Data Lint

on:
  pull_request:
  workflow_dispatch:

jobs:
  awesome-data-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run generate -- --check
